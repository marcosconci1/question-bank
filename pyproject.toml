[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "question-search"
version = "0.1.0"
description = "Retrieval-only semantic search layer over question-bank"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "qdrant-client>=1.12.0",
    "httpx>=0.27.0",
    "mcp>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
question-search = "question_search.cli:main"
question-bank-mcp = "question_bank.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test-*.py", "test_*.py"]
markers = [
    "integration: marks tests requiring a running Qdrant instance",
]
