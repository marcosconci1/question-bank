[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "question-search"
version = "0.1.0"
description = "Retrieval-only semantic search layer over question-bank"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "mcp>=2.3.0",
]

[project.optional-dependencies]
import = [
    "pymupdf>=1.28.2",
]
semantic = [
    "qdrant-client>=1.12.0",
]
web = [
    "starlette>=0.40",
    "uvicorn>=0.30",
]
all = [
    "pymupdf>=1.28.2",
    "qdrant-client>=1.12.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
question-search = "question_search.cli:main"
question-bank-mcp = "question_bank.mcp_server:main"
question-bank = "question_bank.cli:main"
qb = "question_bank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
question_bank = ["tags.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test-*.py", "test_*.py"]
markers = [
    "integration: marks tests requiring a running Qdrant instance",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
