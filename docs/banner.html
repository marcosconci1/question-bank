<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:#ffffff; }
  .card {
    position:absolute; inset:0;
    background:
      radial-gradient(820px 480px at 70% 125%, rgba(240,231,222,.9) 0%, rgba(0,0,0,0) 62%),
      radial-gradient(560px 380px at 16% -18%, rgba(242,240,236,.9) 0%, rgba(0,0,0,0) 55%),
      #f9f7f2;
  }
  .grain {
    position:absolute; inset:0; opacity:.05; pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='1'/></svg>");
    background-size:160px 160px;
  }
  .lockup { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:48px; }
  .mark { width:236px; height:236px; }
  .name { font-family:'Source Serif 4',serif; font-size:118px; font-weight:700; color:#1f1d1a; letter-spacing:-3px; white-space:nowrap; }
  .tagline { position:absolute; bottom:112px; left:0; right:0; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:29px; letter-spacing:2px; color:#8d867a; }
</style></head>
<body>
  <div class="card"></div><div class="grain"></div>
  <div class="lockup">
    <svg class="mark" viewBox="0 0 112 112" fill="none">
      <!-- answer-sheet bubble grid: ghosted rows, one marked hit -->
      <!-- the hit: filled correction-red bubble on its row -->
      <g opacity=".32">
        <circle cx="18" cy="26" r="9" stroke="#1f1d1a" stroke-width="4"/>
        <circle cx="52" cy="26" r="9" stroke="#1f1d1a" stroke-width="4"/>
        <circle cx="86" cy="26" r="9" stroke="#1f1d1a" stroke-width="4"/>
        <circle cx="18" cy="60" r="9" stroke="#1f1d1a" stroke-width="4"/>
        <circle cx="52" cy="60" r="9" stroke="#1f1d1a" stroke-width="4"/>
        <circle cx="86" cy="60" r="9" stroke="#1f1d1a" stroke-width="4"/>
        <circle cx="18" cy="94" r="9" stroke="#1f1d1a" stroke-width="4"/>
        <circle cx="52" cy="94" r="9" stroke="#1f1d1a" stroke-width="4"/>
        <circle cx="86" cy="94" r="9" stroke="#1f1d1a" stroke-width="4"/>
      </g>
      <circle cx="52" cy="60" r="10" fill="#b23a2e"/>
      <path d="M66 60 H106" stroke="#b23a2e" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <div class="name">question-bank</div>
  </div>
  <div class="tagline">every question stored, every question found</div>
</body></html>
